<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificado – III Congreso Unidos x el Cáncer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8f0;--card:#fff;--tx:#2b3350;--mut:#6b7390;--bd:#f1d9bd;--or:#ff8c1a;--or2:#e97a0c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1712;--card:#26211a;--tx:#f3ede4;--mut:#b9ae9c;--bd:#4a3d2b}}
:root[data-theme="dark"]{--bg:#1b1712;--card:#26211a;--tx:#f3ede4;--mut:#b9ae9c;--bd:#4a3d2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:0 0 4px;color:var(--or)}
p.s{margin:0 0 18px;color:var(--mut);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
label{display:block;font-weight:500;font-size:.88rem;margin:12px 0 5px}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:transparent;color:var(--tx)}
input:focus{outline:2px solid var(--or);border-color:var(--or)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{flex:1 1 180px;padding:12px 14px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:var(--or);color:#fff}
button.alt{background:transparent;color:var(--or2);border:1.5px solid var(--or)}
button:disabled{opacity:.5;cursor:not-allowed}
.pv{margin-top:18px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}
canvas{width:100%;height:auto;display:block}
#msg{margin-top:12px;font-size:.9rem;min-height:1.2em}
.err{color:#d33}.ok{color:#2a8a4a}
small{color:var(--mut);display:block;margin-top:10px;font-size:.8rem}
</style></head><body>
<main>
<h1>Certificado de participación</h1>
<p class="s">III Congreso Unidos X el Cáncer · Bariloche, Noviembre 2026</p>
<div class="card">
<label for="n">Nombre y apellido + DNI:(opcional)</label>
<input id="n" autocomplete="name" placeholder="Ej: María Pérez - DNI: 12.345.678">
<label for="o">Organización</label>
<input id="o" autocomplete="organization" placeholder="Ej: Fundación Esperanza">
<label for="e">Correo electrónico (para recibirlo por mail)</label>
<input id="e" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
<div class="row">
<button id="dl">Descargar PDF</button>
<button id="ml" class="alt">Enviarme por mail</button>
</div>
<div id="msg" role="status"></div>
<small>Los datos se usan solo en tu dispositivo para generar el certificado.</small>
</div>
<div class="pv"><canvas id="c" width="2000" height="1414"></canvas></div>
</main>

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id),msg=(t,c)=>{$('msg').className=c||'';$('msg').textContent=t};
const base=new Image();let ready=false;
base.onload=()=>{ready=true;draw()};base.src=IMG;
const FONT='"Poppins",system-ui,Arial,sans-serif';
function fit(t,maxW,start,w){let s=start;ctx.font=w+' '+s+'px '+FONT;while(ctx.measureText(t).width>maxW&&s>28){s-=2;ctx.font=w+' '+s+'px '+FONT}}
function draw(){
 if(!ready)return;
 ctx.clearRect(0,0,2000,1414);ctx.drawImage(base,0,0,2000,1414);
 ctx.fillStyle='#3b4768';ctx.textAlign='center';ctx.textBaseline='alphabetic';
 const n=$('n').value.trim(),o=$('o').value.trim();
 if(n){fit(n,1400,76,'600');ctx.fillText(n,1000,466)}
 if(o){fit(o,1400,62,'500');ctx.fillText(o,1000,706)}
}
['n','o'].forEach(i=>$(i).addEventListener('input',draw));
if(document.fonts){document.fonts.load('600 76px Poppins').then(()=>document.fonts.load('500 62px Poppins')).then(draw).catch(()=>{})}
function valid(needMail){
 if(!$('n').value.trim()||!$('o').value.trim()){msg('Completá nombre, DNI y organización.','err');return false}
 if(needMail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('e').value.trim())){msg('Ingresá un correo válido.','err');return false}
 return true;
}
function fname(){return 'Certificado-UxC-'+$('n').value.trim().replace(/[^\p{L}\p{N}]+/g,'-').replace(/^-|-$/g,'')+'.pdf'}
async function makePdf(){
 await (document.fonts?document.fonts.ready:Promise.resolve());draw();
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:'landscape',unit:'px',format:[2000,1414],compress:true});
 pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,2000,1414,undefined,'FAST');
 return pdf;
}
$('dl').onclick=async()=>{if(!valid(false))return;$('dl').disabled=true;msg('Generando PDF…');
 try{const p=await makePdf();p.save(fname());msg('¡Listo! Tu certificado se descargó.','ok')}catch(e){msg('No se pudo generar el PDF.','err')}
 $('dl').disabled=false};
$('ml').onclick=async()=>{if(!valid(true))return;$('ml').disabled=true;$('dl').disabled=true;msg('Enviando tu certificado…');
 try{
  const p=await makePdf();
  const b64=p.output('datauristring').split(',')[1];
  const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify({nombre:$('n').value.trim(),email:$('e').value.trim(),filename:fname(),pdf:b64})});
  const j=await r.json();
  if(j.ok)msg('¡Enviado! Revisá tu correo (y la carpeta de spam).','ok');else msg('No se pudo enviar: '+(j.error||'error desconocido'),'err');
 }catch(e){msg('No pudimos confirmar el envío. Revisá tu correo o descargá el PDF.','err')}
 $('ml').disabled=false;$('dl').disabled=false};
</script></body></html>
